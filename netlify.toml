# Skip the build (costs 0 Netlify credits) when only notes/docs (*.md) changed.
# Each successful production deploy costs 15 of the free plan's 300 monthly credits.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

# Course-data service lives in netlify/functions (see course.mjs).
[functions]
  node_bundler = "esbuild"

# Make sure phones always check for a new version of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
