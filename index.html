<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B2A4A">
<meta name="apple-mobile-web-app-title" content="Caddie Voice">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>Caddie Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: course picker first; then a full-screen satellite map with a course overview and Start round button, then one hole at a time. Single committed deep-blue look. */
:root{
  --sky:#0B2A4A;      /* page ground */
  --deep:#071C33;     /* gradient floor */
  --panel:#12385F;    /* sheet surface */
  --field:#0B2A4A;    /* input fill */
  --ink:#EAF3FF;      /* text */
  --mist:#9FB8D6;     /* secondary text */
  --line:#24507F;     /* borders */
  --play:#4FB3FF;     /* button */
  --play-ink:#04182C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);background-image:linear-gradient(180deg,var(--sky) 0%,var(--deep) 100%);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.screen{min-height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding-block:40px 36px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.mark{width:84px;height:84px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,15vw,64px);line-height:.9;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.tag{color:var(--mist);margin:0;font-size:15px}
.play{width:100%;background:var(--play);color:var(--play-ink);font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.1em;text-transform:uppercase;padding:20px;border-radius:999px;box-shadow:0 10px 30px rgba(79,179,255,.25)}
@media (prefers-reduced-motion:no-preference){.play{transition:transform .12s}.play:active{transform:scale(.97)}}

/* course sheet */
.scrim{position:fixed;inset:0;background:rgba(2,10,20,.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .24s ease-out}@keyframes rise{from{transform:translateY(40px);opacity:.6}}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
h2{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.02em;margin:0}
label{font-size:13px;color:var(--mist);font-weight:500}
input{font:inherit;width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px}
input::placeholder{color:var(--mist);opacity:.7}
.recent{display:flex;flex-direction:column;gap:8px}
.recent-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);font-weight:600}
.course{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.course small{color:var(--mist);font-size:13px}
.course[aria-pressed="true"]{border-color:var(--play);background:rgba(79,179,255,.12)}
.empty{color:var(--mist);font-size:14px;margin:0}
.go{background:var(--play);color:var(--play-ink);font-weight:600;font-size:17px;padding:16px;border-radius:14px}
.go:disabled{opacity:.4;cursor:default}
.cancel{background:transparent;color:var(--mist);padding:8px}

/* map screen */
.map-screen{position:fixed;inset:0;background:var(--deep)}
#map{position:absolute;inset:0;background:var(--deep)}
.topbar{position:absolute;z-index:1100;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(7,28,51,.92),rgba(7,28,51,0))}
.back{width:44px;height:44px;border-radius:50%;background:var(--panel);color:var(--ink);font-size:22px;flex:0 0 auto;border:1px solid var(--line)}
.topbar h2{font-size:24px;line-height:1.05;min-width:0}
.topbar small{display:block;font-family:var(--body);font-size:12px;color:var(--mist);letter-spacing:.04em;font-weight:500}
.holecard{position:absolute;z-index:1100;left:0;right:0;bottom:0;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.holecard-in{max-width:440px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.holerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{width:48px;height:48px;border-radius:14px;background:var(--field);color:var(--ink);font-size:24px;border:1px solid var(--line)}
.holeinfo{text-align:center;flex:1;min-width:0}
.holeinfo .num{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.holeinfo .meta{font-size:14px;color:var(--mist);font-variant-numeric:tabular-nums}
.pinrow{display:flex;gap:8px}
.pinbtn{flex:1;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:15px}
.pinbtn[aria-pressed="true"]{background:var(--play);color:var(--play-ink);border-color:var(--play)}
.hint{font-size:13px;color:var(--mist);margin:0;text-align:center}
.nomap{position:absolute;z-index:1050;left:50%;bottom:calc(200px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(380px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;text-align:center}
.nomap b{font-size:14px!important}.nomap p{font-size:13px!important}
.nomap b{font-size:16px}
.nomap p{margin:0;font-size:14px;color:var(--mist)}
.nomap a{color:var(--play);font-weight:600}
.osm-status{position:absolute;z-index:1100;left:50%;transform:translateX(-50%);top:calc(72px + env(safe-area-inset-top,0px));
  width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:8px 8px 8px 14px;font-size:13px;line-height:1.35}
.osm-status span{min-width:0}
.osm-status .x,.nomap .x{flex:0 0 auto;width:32px;height:32px;padding:0;border-radius:50%;background:transparent;border:0;color:var(--mist);font-size:22px;line-height:1}
.osm-status .x:hover,.nomap .x:hover{color:var(--ink)}
.nomap{padding-right:40px!important}
.nomap-x{position:absolute;top:4px;right:4px}
.osm-status button{flex:0 0 auto;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.hole-tag{display:flex!important;align-items:center;justify-content:center;background:var(--play);color:var(--play-ink);border:2px solid var(--ink);
  border-radius:50%;font:700 12px/1 var(--body);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.leaflet-marker-icon{display:block}
/* Leaflet essentials */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:var(--body)}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto;cursor:pointer}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-bottom{bottom:0}.leaflet-right{right:0}
.leaflet-control{position:relative;pointer-events:auto}
.leaflet-control-attribution{background:rgba(7,28,51,.7);color:var(--mist);font-size:10px;padding:2px 6px;margin-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.leaflet-control-attribution a{color:var(--mist)}

.picker{gap:20px;padding-block:28px 28px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.brand .mark{width:36px;height:36px}
.picker h1{font-size:clamp(40px,12vw,54px)}
.field{display:flex;flex-direction:column;gap:6px}
.course-list{display:flex;flex-direction:column;gap:8px}
.start-round{position:absolute;z-index:1100;left:50%;top:75%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px))}
@media (prefers-reduced-motion:no-preference){.start-round:active{transform:translate(-50%,-50%) scale(.97)}}
.end{margin-left:auto;flex:0 0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px}
.topbar h2{flex:1}
.layer-btn{position:absolute;z-index:1100;right:max(12px,env(safe-area-inset-right,0px));top:calc(128px + env(safe-area-inset-top,0px));
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tees{position:absolute;z-index:1100;left:50%;transform:translateX(-50%);bottom:calc(25% + 52px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(380px,calc(100% - 24px))}
.tee{background:rgba(18,56,95,.94);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tee[aria-pressed="true"]{background:var(--ink);color:var(--play-ink);border-color:var(--ink)}

/* placeholder after start */
.ready .hero{gap:10px}
.ready .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);font-weight:600}
.ready h1{font-size:clamp(40px,12vw,56px)}
.ghost{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);padding:16px;border-radius:999px;font-weight:600}
</style>

<main class="screen picker" id="home">
  <div class="brand">
    <svg class="mark" viewBox="0 0 84 84" aria-hidden="true">
      <circle cx="42" cy="42" r="40" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
      <line x1="36" y1="18" x2="36" y2="62" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <path d="M37 19 L60 27 L37 35 Z" fill="var(--play)"/>
      <ellipse cx="42" cy="63" rx="16" ry="4" fill="var(--sky)"/>
    </svg>
    Caddie Voice
  </div>
  <h1>Select a course</h1>
  <div class="field">
    <label for="courseInput">Search courses</label>
    <input id="courseInput" type="search" placeholder="Course name or town" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="course-list">
    <div class="recent-title" id="listTitle">Courses</div>
    <div id="recentList" class="course-list"></div>
  </div>
  <div class="course-list" id="resultsBox" hidden>
    <div class="recent-title">Search results</div>
    <div id="resultsList" class="course-list"></div>
  </div>
</main>

<main class="screen ready" id="ready" hidden>
  <div class="hero">
    <div class="eyebrow">Now playing</div>
    <h1 id="readyCourse"></h1>
    <p class="tag" id="readyTag"></p>
  </div>
  <button class="ghost" id="homeBtn">Back to courses</button>
</main>

<section class="map-screen" id="mapScreen" hidden>
  <div id="map" aria-label="Satellite view of the course"></div>
  <div class="topbar">
    <button class="back" id="mapBack" aria-label="Back to courses">‹</button>
    <h2><span id="mapCourse"></span><small id="mapPlace"></small></h2>
    <button class="end" id="endRound" hidden>End round</button>
  </div>
  <div class="osm-status" id="osmStatus" role="status" hidden><span id="osmText"></span><button id="osmRetry" hidden>Retry</button><button class="x" id="osmClose" aria-label="Hide this message">×</button></div>
  <button class="layer-btn" id="layerBtn" aria-label="Switch map style">Map</button>
  <div class="tees" id="teeRow" role="group" aria-label="Tees" hidden></div>
  <button class="play start-round" id="startRound">Start round</button>
  <div class="holecard" id="holeCard" hidden><div class="holecard-in">
    <div class="holerow">
      <button class="step" id="holePrev" aria-label="Previous hole">‹</button>
      <div class="holeinfo"><div class="num" id="holeNum">Hole 1</div><div class="meta" id="holeMeta"></div></div>
      <button class="step" id="holeNext" aria-label="Next hole">›</button>
    </div>
    <div class="pinrow">
      <button class="pinbtn" id="pinGreen" aria-pressed="false">Pin the green</button>
    </div>
    <p class="hint" id="pinHint">Tap "Pin the green," then tap the green on the map. It's saved for every round.</p>
  </div></div>
</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

function courseOptions(){
  const known = KNOWN.filter(k => !courses.some(c => c.name.toLowerCase() === k.name.toLowerCase()))
    .map(k => ({ name:k.name, sub:k.place.split(' · ')[0] + ' · Course map' }));
  return [...courses, ...known];

function renderRecent(){
  const box = $('#recentList'), typedRaw = $('#courseInput').value.trim(), typed = typedRaw.toLowerCase();

  $('#listTitle').textContent = typed ? 'Matches' : 'Courses';
  $('#listTitle').parentElement.hidden = !!typed && !list.length;
  list.slice(0, 8).forEach(c => {

    const n = document.createElement('span'); n.textContent = c.name;
    const d = document.createElement('small'); d.textContent = c.sub || ('Last played ' + fmt(c.last));

function update(){ renderRecent(); }
function choose(name){
  name = name.trim(); if (!name) return;
  courses = [{ name, last: Date.now() }, ...courses.filter(c => c.name.toLowerCase() !== name.toLowerCase())].slice(0, 20);
  save(courses);
  const k = findKnown(name);
  $('#home').hidden = true;
  if (k) openMap(k); else lookupCourse(name);

    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));

async function ogaSearch(term){

  return (d.courses || []).slice(0, 25).map(c => ({ src:'oga', id:c.id, name:c.course_name || c.name,
    sub:[[c.city, c.state].filter(Boolean).join(', '), c.par && `Par ${c.par}`].filter(Boolean).join(' · '), center:[c.latitude, c.longitude] }));

async function osmSearch(q){

async function runSearch(q){
  const seq = ++searchSeq;
  showResults(null, 'Searching…');
  const qt = words(q);
  /* the full phrase plus each important word on its own, so word order and extra words don't matter */
  const terms = [...new Set([q, ...qt.filter(t => t.length >= 3)])].slice(0, 4);
  let pool = [], ogaOk = false;
  const runOga = async list => {
    const res = await Promise.allSettled(list.map(ogaSearch));
    res.forEach(r => { if (r.status === 'fulfilled'){ ogaOk = true; pool.push(...r.value); } });
  };
  await runOga(terms);
  /* nothing at all? maybe a typo — try the first letters of each long word */
  if (ogaOk && !pool.length){
    const stems = [...new Set(qt.filter(t => t.length >= 5).map(t => t.slice(0, 4)))].slice(0, 3);
    if (stems.length) await runOga(stems);
  }
  if (seq !== searchSeq) return;
  const seen = new Set();
  let list = rank(q, pool.filter(r => !seen.has(r.id) && seen.add(r.id)));
  const strong = list.length && list[0].score >= 4;      // every word matched
  if (!strong){
    try {
      const osm = rank(q, await osmSearch(q));
      if (seq !== searchSeq) return;
      const names = new Set(list.map(r => norm(r.name)));
      list = [...list, ...osm.filter(r => !names.has(norm(r.name)))].sort((a, b) => b.score - a.score);
    } catch { if (!list.length){ if (seq === searchSeq) showResults([], "Couldn't reach course search. Check your signal and try again."); return; } }
  }
  if (seq !== searchSeq) return;
  list = list.slice(0, 8);

}

const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const OKEY = 'caddie-voice-osm-', M2YD = 1.09361, CACHE_DAYS = 30;
function distM(a, b){ const R = 6371000, r = Math.PI/180, dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;

  return inside; }

const courseQuery = ([la, lo]) => `[out:json][timeout:25];
(way["leisure"="golf_course"](around:500,${la},${lo});relation["leisure"="golf_course"](around:500,${la},${lo}););
out geom;
map_to_area->.a;
(way["golf"](area.a);node["golf"="pin"](area.a);relation["golf"](area.a);way["natural"~"^(water|sand)$"](area.a);relation["natural"="water"](area.a););
out geom;`;
const nearQuery = ([la, lo]) => `[out:json][timeout:25];
(way["golf"](around:1500,${la},${lo});node["golf"="pin"](around:1500,${la},${lo});relation["golf"](around:1500,${la},${lo});way["natural"~"^(water|sand)$"](around:1200,${la},${lo}););

function parseOSM(json){
  const F = { boundary:[], holes:[], greens:[], tees:[], fairways:[], bunkers:[], water:[] };
  const pts = g => g.map(p => [+p.lat.toFixed(6), +p.lon.toFixed(6)]);
  const geomOf = el => el.type === 'way' ? [pts(el.geometry || [])]
    : el.type === 'relation' ? (el.members || []).filter(m => m.geometry && m.role !== 'inner').map(m => pts(m.geometry))
    : [[[el.lat, el.lon]]];
  const seen = new Set();
  for (const el of json.elements || []){
    const t = el.tags || {}, g = geomOf(el);
    if (!g.length || !g[0].length) continue;
    if (t.leisure === 'golf_course') F.boundary.push(...g);
    else if (t.golf === 'hole'){
      const ref = parseInt(t.ref, 10);
      if (ref > 0 && g[0].length > 1 && !seen.has(ref)){ seen.add(ref);
        F.holes.push({ ref, par: +t.par || null, hcp: +t.handicap || null, line: g[0] }); }
    }
    else if (t.golf === 'green') F.greens.push(...g);
    else if (t.golf === 'tee') F.tees.push(...g);
    else if (t.golf === 'fairway') F.fairways.push(...g);
    else if (t.golf === 'bunker' || t.natural === 'sand') F.bunkers.push(...g);
    else if (/water_hazard/.test(t.golf || '') || t.natural === 'water') F.water.push(...g);

}

/* Find the green at the end of a hole line; front/back measured along the line of play */
function greenFor(h){
  const end = h.line[h.line.length-1], prev = h.line[h.line.length-2];
  let best = null, bd = Infinity;
  for (const g of osmData.greens){ if (g.length < 3) continue;
    const d = inPoly(end, g) ? 0 : distM(end, centroid(g)); if (d < bd){ bd = d; best = g; } }
  if (!best || bd > 60) return { mid: end };
  const k = Math.cos(end[0]*Math.PI/180), dir = [end[0]-prev[0], (end[1]-prev[1])*k], L0 = Math.hypot(...dir) || 1;
  dir[0] /= L0; dir[1] /= L0;
  const mid = centroid(best), proj = p => (p[0]-mid[0])*dir[0] + (p[1]-mid[1])*k*dir[1];
  let lo = 0, hi = 0; best.forEach(p => { const v = proj(p); lo = Math.min(lo, v); hi = Math.max(hi, v); });
  const along = v => [mid[0] + dir[0]*v, mid[1] + dir[1]*v/k];
  return { front: along(lo), mid, back: along(hi), poly: best };
}

async function loadOSM(k, force){
  osmData = null; osmLayer?.remove(); curLayer?.remove();
  const cached = !force && readCache(k.id);
  if (cached) return applyOSM(k, cached, 'saved');
  if (k.osm && !force) applyOSM(k, k.osm, 'built-in');   // show built-in layout now; check for newer data quietly
  else setStatus('Looking up hole layouts on OpenStreetMap…');
  try {
    let F = parseOSM(await overpass(courseQuery(k.center)));
    if (F.holes.length < 18){
      const F2 = parseOSM(await overpass(nearQuery(k.center)));
      if (F2.holes.length > F.holes.length || (!F.holes.length && F2.greens.length > F.greens.length)){ F2.boundary = F.boundary; F = F2; } }
    if (course !== k) return;
    if (k.osm && k.osm.holes.length >= F.holes.length){ if (force) applyOSM(k, k.osm, 'built-in'); return; }
    if (F.holes.length || F.greens.length) writeCache(k.id, F);   // never save an empty result

}

/* metres from a point to a polyline */
function nearLine(p, line){
  const k = Math.cos(p[0]*Math.PI/180), M = 111320; let best = Infinity;
  for (let i = 1; i < line.length; i++){
    const ax = (line[i-1][1]-p[1])*k*M, ay = (line[i-1][0]-p[0])*M, bx = (line[i][1]-p[1])*k*M, by = (line[i][0]-p[0])*M;
    const dx = bx-ax, dy = by-ay, t = Math.max(0, Math.min(1, -(ax*dx + ay*dy)/((dx*dx + dy*dy) || 1)));
    best = Math.min(best, Math.hypot(ax + t*dx, ay + t*dy));

  return best;
}

      : nearLine(centroid(p), h.line) < (kind === 'tees' ? 30 : 45);
    if (near) L.polygon(p, { ...st, interactive:false }).addTo(layer);
  }
  holeTag(h.ref, h.line[0]).addTo(layer);
}

      baseLayers = {
        sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          { maxZoom:20, maxNativeZoom:19, attribution:'Imagery © Esri, Maxar · Course data © OpenStreetMap contributors' }),
        map: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
          { maxZoom:20, maxNativeZoom:19, attribution:'© OpenStreetMap contributors' })
      };
      Object.values(baseLayers).forEach(l => l.on('tileload', () => { tilesOk = true; }));
      setBase(baseName);
      map.on('click', e => { if (!pinning || mode !== 'round') return;
        (greens[course.id] ||= {})[hole] = [e.latlng.lat, e.latlng.lng]; saveGreens();
        pinning = false; renderHole(); });
    } else map.setView(k.center, k.zoom);
    setTimeout(() => map.invalidateSize(), 60);
  }
  setMode('overview');
  loadOSM(k);
  enrich(k);
}
function setMode(m){
  mode = m; const r = m === 'round';
  $('#holeCard').hidden = !r; $('#startRound').hidden = r; $('#endRound').hidden = !r; $('#mapBack').hidden = r;
  if (!r) pinning = false;
  showStatus(); renderTees(); render();
}
function render(){
  if (mode === 'round') return renderHole();
  if (!map || !course) return;
  curLayer?.remove(); curLayer = null;
  if (osmLayer && !map.hasLayer(osmLayer)) osmLayer.addTo(map);
  fitCourse();
}
function fitCourse(){
  const pts = !osmData ? [] : osmData.boundary.length ? osmData.boundary.flat()
    : [...osmData.holes.flatMap(h => h.line), ...osmData.greens.flat()];
  if (pts.length) map.flyToBounds(L.latLngBounds(pts), { paddingTopLeft:[24,96], paddingBottomRight:[24, Math.round(innerHeight*0.32)], duration:.6 });
  else map.setView(course.center, course.zoom);
}
function startRound(){ hole = 1; statusDismissed = false; setMode('round'); }
function endRound(){ statusDismissed = false; setMode('overview'); }

function renderHole(fly = true){
  const n = hole, info = holeInfo(n), pin = (greens[course.id] || {})[n], gp = info.green?.poly;
  $('#holeNum').textContent = 'Hole ' + n;
  $('#holeMeta').textContent = [info.par && `Par ${info.par}`, info.yds && `${info.yds} yds`, info.hcp && `Handicap ${info.hcp}`]
    .filter(Boolean).join(' · ') || 'No scorecard for this hole';
  $('#pinGreen').setAttribute('aria-pressed', pinning);
  $('#pinGreen').textContent = pinning ? 'Tap the green…' : pin ? 'Move green pin' : gp ? 'Adjust green' : 'Pin the green';
  $('#pinHint').textContent = pinning ? `Tap the middle of the green for hole ${n}.`
    : pin ? `Using your green pin for hole ${n}.`
    : gp ? 'Green mapped from OpenStreetMap: front, middle and back.'
    : info.oh ? 'Hole route found but no green outline. Pin the green to set it.'
    : osmData?.greens.length ? `This hole isn't labeled in OpenStreetMap, so the whole course is shown. Tap "Pin the green," then tap hole ${n}'s green.`
    : 'Tap "Pin the green," then tap the green on the map. It\'s saved for every round.';
  if (!map) return;
  osmLayer?.remove();
  curLayer?.remove(); curLayer = L.layerGroup().addTo(map);
  const pts = [];
  if (info.oh && osmData) drawHoleFeatures(info.oh, gp, curLayer);
  const showAll = !info.oh && osmData && (osmData.greens.length || osmData.fairways.length);
  if (showAll) for (const [kind, st] of Object.entries(STYLE)) osmData[kind].forEach(p => p.length > 2 && L.polygon(p, { ...st, interactive:false }).addTo(curLayer));
  if (info.oh){ L.polyline(info.oh.line, { color:'#4FB3FF', weight:4, interactive:false }).addTo(curLayer); pts.push(...info.oh.line); }
  if (gp){
    L.polygon(gp, { color:'#4FB3FF', weight:3, fill:false, interactive:false }).addTo(curLayer); pts.push(...gp);
    ['front','back'].forEach(s => L.circleMarker(info.green[s], { radius:5, color:'#04182C', weight:2, fillColor:'#EAF3FF', fillOpacity:1, interactive:false }).addTo(curLayer));
  }
  const mid = pin || info.green?.mid;
  if (mid){ L.circleMarker(mid, { radius:8, color:'#EAF3FF', weight:3, fillColor:'#4FB3FF', fillOpacity:1, interactive:false }).addTo(curLayer); pts.push(mid); }
  if (fly && !pinning){
    if (pts.length > 1) map.flyToBounds(L.latLngBounds(pts), { paddingTopLeft:[30,110], paddingBottomRight:[30,220], maxZoom:18, duration:.6 });
    else if (pts.length) map.flyTo(pts[0], 18, { duration:.6 });
    else fitCourse();
  }
}
$('#holePrev').onclick = () => { const c = holeCount(); hole = hole > 1 ? hole-1 : c; pinning = false; renderHole(); };
$('#holeNext').onclick = () => { const c = holeCount(); hole = hole < c ? hole+1 : 1; pinning = false; renderHole(); };
$('#pinGreen').onclick = () => { pinning = !pinning; renderHole(false); };
$('#osmRetry').onclick = () => course && loadOSM(course, true);
$('#osmClose').onclick = () => { $('#osmStatus').hidden = true; statusDismissed = true; };   // hidden for the rest of this round
$('#mapBack').onclick = () => { $('#mapScreen').hidden = true; $('#osmStatus').hidden = true; $('#home').hidden = false; course = null; $('#courseInput').value = ''; $('#resultsBox').hidden = true; update(); };
$('#startRound').onclick = startRound;
$('#endRound').onclick = endRound;

/* ---------- find any course by name (OpenStreetMap search) ---------- */
const GKEY = 'caddie-voice-geo';
async function lookupCourse(name){
  $('#readyCourse').textContent = name; $('#readyTag').textContent = 'Finding this course on the map…'; $('#ready').hidden = false;
  let geo = {}; try { geo = JSON.parse(localStorage.getItem(GKEY)) || {}; } catch {}
  const key = name.toLowerCase(); let c = geo[key];
  if (!c){
    try {
      const q = name + (/golf|country club|links/i.test(name) ? '' : ' golf course');
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=' + encodeURIComponent(q));
      const list = await r.json();
      const hit = list.find(x => x.type === 'golf_course') || list[0];
      if (hit){
        const parts = hit.display_name.split(',').map(s => s.trim());
        c = { id:`osm-${hit.osm_type}-${hit.osm_id}`, name, place: parts.slice(1, 3).join(', '), center:[+hit.lat, +hit.lon], zoom:16, holes:null };
        geo[key] = c; try { localStorage.setItem(GKEY, JSON.stringify(geo)); } catch {}
      }
    } catch { $('#readyTag').textContent = "Couldn't reach the map search. Check your signal and try again."; return; }
  }
  if (!c){ $('#readyTag').textContent = 'No course by that name on the map. Try adding the town, like "Bethpage Black, Farmingdale".'; return; }
  if ($('#ready').hidden) return;
  $('#ready').hidden = true; openMap(c);
}

$('#courseInput').oninput = () => { update(); queueSearch(); };
$('#courseInput').onkeydown = e => { if (e.key !== 'Enter') return; e.preventDefault();
  const q = $('#courseInput').value.trim(); if (!q) return;
  const local = courseOptions().filter(c => matchScore(q, c.name, c.sub || c.sub0) >= 4);
  if (local.length === 1) return openEntry(local[0]);
  if (results.length) return openResult(results[0]);
  clearTimeout(searchT); runSearch(q); };
$('#homeBtn').onclick = () => { $('#ready').hidden = true; $('#home').hidden = false; };
update();

/* Installable app: save the app on the phone so it opens with weak or no signal.
   Only on real web addresses (https or localhost); skipped elsewhere. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
